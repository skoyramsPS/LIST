name: thelist
description: >-
  TheLIST — an offline-first, local-first Flutter list app with a true
  end-to-end-encrypted multi-device sync engine.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  # Local database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  # Routing
  go_router: ^14.0.0
  # Notifications
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.5.2
  # Sync / backend (only ever imported under lib/sync/)
  supabase_flutter: ^2.5.0
  # Crypto (E2EE payload + key management)
  cryptography: ^2.7.0
  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0          # used by the harness self-tests in test/harness/
  flutter_lints: ^4.0.0
  custom_lint: ^0.6.0
  riverpod_lint: ^3.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  riverpod_generator: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600

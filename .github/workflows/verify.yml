name: verify

# Runs the full harness on every push and PR. A green check here is the public,
# continuously-verified proof that TheLIST's invariants hold — part of the
# portfolio thesis (AGENTS.md §0).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"

      - name: Install dependencies
        run: flutter pub get

      - name: Run make verify
        run: dart run tool/verify.dart
